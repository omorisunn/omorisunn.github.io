<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="半透明界面层叠与运动轨迹的抽象图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a14"/>
      <stop offset=".48" stop-color="#14102a"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyan" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fc8ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#5fc8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#b5a8ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".08"/>
      <stop offset=".35" stop-color="#9d8cff" stop-opacity=".5"/>
      <stop offset=".72" stop-color="#78d0ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#78d0ff" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="62"/>
    </filter>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="window3">
      <rect x="360" y="128" width="500" height="316" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <ellipse cx="250" cy="90" rx="430" ry="270" fill="url(#violet)" filter="url(#soft)"/>
  <ellipse cx="1010" cy="680" rx="470" ry="280" fill="url(#cyan)" filter="url(#soft)"/>

  <g transform="rotate(-7 600 375)">
    <rect x="210" y="208" width="690" height="420" rx="34" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="284" y="166" width="570" height="366" rx="28" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".16"/>
    <rect x="356" y="124" width="508" height="324" rx="26" fill="#151529" fill-opacity=".44" stroke="url(#frame)" stroke-width="1.2"/>

    <g clip-path="url(#window3)">
      <rect x="356" y="124" width="508" height="324" fill="#ffffff" fill-opacity=".055"/>
      <rect x="360" y="130" width="500" height="72" fill="#ffffff" fill-opacity=".045"/>
      <circle cx="392" cy="166" r="5" fill="#ffffff" fill-opacity=".34"/>
      <circle cx="412" cy="166" r="5" fill="#ffffff" fill-opacity=".2"/>
      <circle cx="432" cy="166" r="5" fill="#ffffff" fill-opacity=".14"/>
      <rect x="462" y="158" width="170" height="16" rx="8" fill="#ffffff" fill-opacity=".075"/>
      <rect x="388" y="226" width="150" height="18" rx="9" fill="#ffffff" fill-opacity=".22"/>
      <rect x="388" y="258" width="250" height="11" rx="5.5" fill="#ffffff" fill-opacity=".11"/>
      <rect x="388" y="280" width="214" height="11" rx="5.5" fill="#ffffff" fill-opacity=".08"/>
      <rect x="388" y="316" width="118" height="34" rx="17" fill="#7c5cff" fill-opacity=".32" stroke="#b9aaff" stroke-opacity=".3"/>
      <rect x="522" y="316" width="104" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".13"/>
      <g opacity=".8">
        <rect x="624" y="226" width="202" height="150" rx="18" fill="#090a13" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".13"/>
        <path d="M646 340 L690 296 L724 320 L756 270 L804 300" fill="none" stroke="#80ccff" stroke-opacity=".58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="690" cy="296" r="3.5" fill="#b9aaff"/>
        <circle cx="724" cy="320" r="3.5" fill="#80ccff" fill-opacity=".8"/>
        <circle cx="756" cy="270" r="3.5" fill="#b9aaff" fill-opacity=".8"/>
        <rect x="646" y="244" width="92" height="8" rx="4" fill="#ffffff" fill-opacity=".13"/>
        <rect x="646" y="260" width="58" height="8" rx="4" fill="#ffffff" fill-opacity=".08"/>
      </g>
    </g>

    <path d="M232 236 L774 236" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M298 184 L804 184" stroke="#ffffff" stroke-opacity=".1"/>
  </g>

  <path d="M-40 628 C 170 558, 248 278, 524 318 S 910 562, 1238 214" fill="none" stroke="url(#trail)" stroke-width="2"/>
  <path d="M-20 676 C 214 604, 318 380, 576 396 S 936 536, 1218 292" fill="none" stroke="#7c5cff" stroke-opacity=".14" stroke-width="1.2"/>
  <path d="M100 710 C 332 622, 402 466, 636 454 S 1002 466, 1218 350" fill="none" stroke="#6fcaff" stroke-opacity=".09" stroke-width="1"/>

  <g>
    <circle cx="524" cy="318" r="4.5" fill="#b9aaff" fill-opacity=".95"/>
    <circle cx="524" cy="318" r="14" fill="none" stroke="#b9aaff" stroke-opacity=".22"/>
    <circle cx="906" cy="430" r="3.5" fill="#80ccff" fill-opacity=".8"/>
    <circle cx="906" cy="430" r="11" fill="none" stroke="#80ccff" stroke-opacity=".16"/>
    <circle cx="232" cy="236" r="2.5" fill="#ffffff" fill-opacity=".42"/>
    <circle cx="1012" cy="170" r="2.5" fill="#ffffff" fill-opacity=".28"/>
    <circle cx="170" cy="440" r="2" fill="#ffffff" fill-opacity=".2"/>
  </g>

  <g opacity=".55">
    <path d="M84 178 L84 240 M54 209 L114 209" stroke="#ffffff" stroke-opacity=".16"/>
    <path d="M1104 558 L1104 604 M1080 581 L1128 581" stroke="#ffffff" stroke-opacity=".13"/>
  </g>

  <rect x="0" y="0" width="1200" height="750" fill="url(#bg)" fill-opacity=".06"/>
</svg>
